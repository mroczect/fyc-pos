[package]
name = "libfycdb"
version = "0.3.0"
edition = "2024"

[dependencies]
librage = { git = "https://github.com/mroczect/librage.git" }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
